# Test configuration - uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

app.file.upload-dir=./test-uploads
app.matching.weight.required-skills=0.60
app.matching.weight.preferred-skills=0.20
app.matching.weight.experience=0.10
app.matching.weight.education=0.10
app.matching.min-recommendation-score=20.0

logging.level.root=WARN
logging.level.com.resumescreening=WARN
