<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Not Found')}"></th:block></head>
<body class="page-wrapper">
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<main class="main-content">
  <div class="container" style="text-align:center;padding:4rem 0">
    <div style="font-size:5rem;margin-bottom:1rem">🔍</div>
    <h1 style="font-size:2rem;font-weight:700;color:var(--gray-800)">Page Not Found</h1>
    <p class="text-muted" style="margin:1rem 0" th:text="${message ?: 'The page you are looking for does not exist or has been moved.'}">msg</p>
    <a href="javascript:history.back()" class="btn btn-outline" style="margin-right:.75rem">← Go Back</a>
    <a th:href="@{/}" class="btn btn-primary">Go Home</a>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
