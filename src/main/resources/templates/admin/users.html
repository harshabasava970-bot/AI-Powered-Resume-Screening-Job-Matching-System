<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Manage Users')}"></th:block></head>
<body class="page-wrapper">
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: flashMessages}"></th:block>
<main class="main-content">
  <div class="container">
    <div class="page-header-row">
      <div class="page-header">
        <h1 class="page-title">Manage Users</h1>
        <p class="page-subtitle" th:text="${totalCount} + ' users'">Users</p>
      </div>
      <div style="display:flex;gap:.5rem">
        <a th:href="@{/admin/users}" class="btn btn-outline btn-sm">All</a>
        <a th:href="@{/admin/users/candidates}" class="btn btn-outline btn-sm">Candidates</a>
        <a th:href="@{/admin/users/recruiters}" class="btn btn-outline btn-sm">Recruiters</a>
      </div>
    </div>
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td><div style="font-weight:500" th:text="${u.fullName}">Name</div>
                  <div class="text-xs text-muted" th:text="'@' + ${u.username}">user</div></td>
              <td class="text-sm" th:text="${u.email}">email</td>
              <td><span class="badge" th:classappend="${u.role == 'CANDIDATE' ? 'badge-info' : (u.role == 'RECRUITER' ? 'badge-warning' : 'badge-danger')}" th:text="${u.role}">r</span></td>
              <td><span th:class="${u.enabled ? 'badge badge-success' : 'badge badge-danger'}" th:text="${u.enabled ? 'Active' : 'Disabled'}">s</span></td>
              <td class="text-sm text-muted" th:text="${#temporals.format(u.createdAt,'MMM d, yyyy')}">date</td>
              <td>
                <div style="display:flex;gap:.4rem">
                  <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="margin:0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" th:class="${u.enabled ? 'btn btn-warning btn-sm' : 'btn btn-success btn-sm'}"
                            th:text="${u.enabled ? 'Disable' : 'Enable'}">toggle</button>
                  </form>
                  <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="margin:0"
                        th:if="${u.role != 'ADMIN'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm"
                            data-confirm="Permanently delete this user and all their data?">Delete</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
