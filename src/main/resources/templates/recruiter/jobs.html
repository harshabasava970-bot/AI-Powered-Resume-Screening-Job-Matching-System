<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('My Jobs')}"></th:block></head>
<body class="page-wrapper">
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: flashMessages}"></th:block>
<main class="main-content">
  <div class="container">
    <div class="page-header-row">
      <div class="page-header"><h1 class="page-title">My Job Postings</h1></div>
      <a th:href="@{/recruiter/jobs/create}" class="btn btn-primary">➕ Post New Job</a>
    </div>
    <div th:if="${#lists.isEmpty(jobs)}" class="card"><div class="card-body">
      <div class="empty-state">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-title">No jobs posted yet</div>
        <a th:href="@{/recruiter/jobs/create}" class="btn btn-primary">Post Your First Job</a>
      </div>
    </div></div>
    <div class="card" th:unless="${#lists.isEmpty(jobs)}">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Title</th><th>Location</th><th>Type</th><th>Required Skills</th><th>Status</th><th>Posted</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="job : ${jobs}">
              <td style="font-weight:600" th:text="${job.title}">Title</td>
              <td th:text="${job.location ?: '-'}">loc</td>
              <td><span th:if="${job.employmentType}" class="badge badge-info" th:text="${job.employmentType}">type</span></td>
              <td>
                <div class="skill-tags">
                  <span th:each="s,i : ${job.requiredSkills}" th:if="${i.index < 3}" class="skill-tag text-xs" th:text="${s}">s</span>
                  <span th:if="${#lists.size(job.requiredSkills) > 3}" class="skill-tag" th:text="'+' + (${#lists.size(job.requiredSkills)}-3)">+N</span>
                </div>
              </td>
              <td><span class="badge" th:classappend="${job.status == 'ACTIVE' ? 'badge-success' : 'badge-warning'}" th:text="${job.status}">s</span></td>
              <td class="text-sm text-muted" th:text="${#temporals.format(job.postedAt,'MMM d, yyyy')}">date</td>
              <td>
                <div style="display:flex;gap:.4rem;flex-wrap:wrap">
                  <a th:href="@{/recruiter/jobs/{id}/candidates(id=${job.id})}" class="btn btn-outline btn-sm">👥 Candidates</a>
                  <a th:href="@{/recruiter/jobs/{id}/edit(id=${job.id})}" class="btn btn-outline btn-sm">✏️ Edit</a>
                  <form th:action="@{/recruiter/jobs/{id}/delete(id=${job.id})}" method="post" style="margin:0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" data-confirm="Delete this job? This cannot be undone.">🗑</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
