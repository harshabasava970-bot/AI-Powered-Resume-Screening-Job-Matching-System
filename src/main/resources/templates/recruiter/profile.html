<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Recruiter Profile')}"></th:block></head>
<body class="page-wrapper">
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: flashMessages}"></th:block>
<main class="main-content">
  <div class="container" style="max-width:720px">
    <div class="page-header"><h1 class="page-title">Company & Profile</h1></div>
    <div class="card">
      <div class="card-header"><span class="card-title">Profile Information</span></div>
      <div class="card-body">
        <form th:action="@{/recruiter/profile}" th:object="${updateRequest}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row">
            <div class="form-group"><label class="form-label">First Name</label>
              <input type="text" th:field="*{firstName}" class="form-control" th:placeholder="${user.firstName}"/></div>
            <div class="form-group"><label class="form-label">Last Name</label>
              <input type="text" th:field="*{lastName}" class="form-control" th:placeholder="${user.lastName}"/></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Company Name</label>
              <input type="text" th:field="*{companyName}" class="form-control" th:placeholder="${profile?.companyName}"/></div>
            <div class="form-group"><label class="form-label">Job Title</label>
              <input type="text" th:field="*{jobTitle}" class="form-control" th:placeholder="${profile?.jobTitle}"/></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Industry</label>
              <input type="text" th:field="*{industry}" class="form-control" th:placeholder="${profile?.industry}"/></div>
            <div class="form-group"><label class="form-label">Phone</label>
              <input type="text" th:field="*{phone}" class="form-control" th:placeholder="${profile?.phone}"/></div>
          </div>
          <div class="form-group"><label class="form-label">Company Website</label>
            <input type="url" th:field="*{companyWebsite}" class="form-control" th:placeholder="${profile?.companyWebsite}"/></div>
          <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
