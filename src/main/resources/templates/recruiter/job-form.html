<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Post Job')}"></th:block></head>
<body class="page-wrapper">
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: flashMessages}"></th:block>
<main class="main-content">
  <div class="container" style="max-width:860px">
    <div class="page-header">
      <a th:href="@{/recruiter/jobs}" class="btn btn-outline btn-sm" style="margin-bottom:1rem">← My Jobs</a>
      <h1 class="page-title" th:text="${job != null ? 'Edit Job: ' + job.title : 'Post New Job'}">Post Job</h1>
    </div>
    <div th:if="${error}" class="alert alert-danger"><span class="alert-icon">✕</span><span th:text="${error}"></span></div>

    <form th:action="${job != null ? '/recruiter/jobs/' + job.id + '/edit' : '/recruiter/jobs/create'}"
          th:object="${jobRequest}" method="post" id="jobForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><span class="card-title">Basic Information</span></div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Job Title <span class="required">*</span></label>
              <input type="text" th:field="*{title}" class="form-control"
                     th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" placeholder="e.g. Senior Java Developer"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Company Name <span class="required">*</span></label>
              <input type="text" th:field="*{companyName}" class="form-control"
                     th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid'" placeholder="Your company name"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
            </div>
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label class="form-label">Location</label>
              <input type="text" th:field="*{location}" class="form-control" placeholder="City, Country or Remote"/>
            </div>
            <div class="form-group">
              <label class="form-label">Employment Type</label>
              <select th:field="*{employmentType}" class="form-control">
                <option value="">-- Select --</option>
                <option th:each="type : ${employmentTypes}" th:value="${type}" th:text="${type}">type</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Experience Required</label>
              <input type="text" th:field="*{experienceRequired}" class="form-control" placeholder="e.g. 1-3 years"/>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Salary Range</label>
              <input type="text" th:field="*{salaryRange}" class="form-control" placeholder="e.g. $70,000 - $100,000"/>
            </div>
            <div class="form-group">
              <label class="form-label">Application Deadline</label>
              <input type="date" th:field="*{applicationDeadline}" class="form-control"/>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><span class="card-title">Job Description</span></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Description <span class="required">*</span></label>
            <textarea th:field="*{description}" class="form-control" rows="6"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                      placeholder="Describe the role, team, and what you're looking for..."></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Key Responsibilities</label>
            <textarea th:field="*{responsibilities}" class="form-control" rows="4" placeholder="List the main responsibilities..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Qualifications</label>
            <textarea th:field="*{qualifications}" class="form-control" rows="4" placeholder="Education, certifications, etc."></textarea>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><span class="card-title">Skills</span></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Required Skills <span class="required">*</span></label>
            <div class="skill-input-container" data-field-name="requiredSkills">
              <div class="skill-tags-input skill-tags" id="requiredSkillTags" style="min-height:40px;padding:.4rem;border:1px solid var(--gray-300);border-radius:var(--radius);margin-bottom:.5rem">
                <span th:each="s : ${jobRequest.requiredSkills}" class="skill-tag" th:text="${s}"
                      th:attr="data-skill=${s.toLowerCase()}">s
                  <button type="button" th:onclick="'this.parentElement.remove()'">×</button>
                </span>
              </div>
              <div class="skill-hidden-inputs">
                <input th:each="s : ${jobRequest.requiredSkills}" type="hidden" name="requiredSkills" th:value="${s}"/>
              </div>
              <input type="text" list="skillSuggestions" class="form-control skill-text-input" placeholder="Type a skill and press Enter (e.g. Java, Spring Boot)"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Preferred Skills <span class="text-muted">(optional)</span></label>
            <div class="skill-input-container" data-field-name="preferredSkills">
              <div class="skill-tags-input skill-tags" style="min-height:40px;padding:.4rem;border:1px solid var(--gray-300);border-radius:var(--radius);margin-bottom:.5rem">
                <span th:each="s : ${jobRequest.preferredSkills}" class="skill-tag skill-tag-preferred" th:text="${s}"
                      th:attr="data-skill=${s.toLowerCase()}">s
                  <button type="button" th:onclick="'this.parentElement.remove()'">×</button>
                </span>
              </div>
              <div class="skill-hidden-inputs">
                <input th:each="s : ${jobRequest.preferredSkills}" type="hidden" name="preferredSkills" th:value="${s}"/>
              </div>
              <input type="text" list="skillSuggestions" class="form-control skill-text-input" placeholder="Type a preferred skill and press Enter"/>
            </div>
          </div>
          <!-- Skill datalist -->
          <datalist id="skillSuggestions">
            <option th:each="s : ${allSkills}" th:value="${s.name}"></option>
          </datalist>
        </div>
      </div>

      <div style="display:flex;gap:.75rem">
        <button type="submit" class="btn btn-primary btn-lg">
          💾 <span th:text="${job != null ? 'Update Job' : 'Post Job'}">Post</span>
        </button>
        <a th:href="@{/recruiter/jobs}" class="btn btn-outline btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
