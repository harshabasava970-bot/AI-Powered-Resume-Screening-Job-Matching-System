<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('My Profile')}"></th:block></head>
<body class="page-wrapper">
<th:block th:replace="~{fragments/layout :: navbar}"></th:block>
<th:block th:replace="~{fragments/layout :: flashMessages}"></th:block>
<main class="main-content">
  <div class="container" style="max-width:720px">
    <div class="page-header"><h1 class="page-title">My Profile</h1></div>
    <div class="card">
      <div class="card-header"><span class="card-title">Personal Information</span></div>
      <div class="card-body">
        <form th:action="@{/candidate/profile}" th:object="${updateRequest}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" th:field="*{firstName}" class="form-control" th:placeholder="${user.firstName}"/>
            </div>
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input type="text" th:field="*{lastName}" class="form-control" th:placeholder="${user.lastName}"/>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="text" th:field="*{phone}" class="form-control" th:placeholder="${profile?.phone ?: '+1-555-0100'}"/>
            </div>
            <div class="form-group">
              <label class="form-label">Location</label>
              <input type="text" th:field="*{location}" class="form-control" th:placeholder="${profile?.location ?: 'City, Country'}"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Headline</label>
            <input type="text" th:field="*{headline}" class="form-control" th:placeholder="${profile?.headline ?: 'e.g. Full Stack Java Developer'}"/>
          </div>
          <div class="form-group">
            <label class="form-label">Summary</label>
            <textarea th:field="*{summary}" class="form-control" rows="4" th:placeholder="${profile?.summary ?: 'Brief professional summary...'}"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">LinkedIn URL</label>
              <input type="url" th:field="*{linkedinUrl}" class="form-control" th:placeholder="${profile?.linkedinUrl ?: 'https://linkedin.com/in/...'}"/>
            </div>
            <div class="form-group">
              <label class="form-label">GitHub URL</label>
              <input type="url" th:field="*{githubUrl}" class="form-control" th:placeholder="${profile?.githubUrl ?: 'https://github.com/...'}"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Portfolio URL</label>
            <input type="url" th:field="*{portfolioUrl}" class="form-control" th:placeholder="${profile?.portfolioUrl ?: 'https://yourportfolio.com'}"/>
          </div>

          <div style="padding:1rem;background:var(--gray-50);border-radius:var(--radius);margin-bottom:1.25rem">
            <div class="text-sm text-muted">
              <strong>Email:</strong> <span th:text="${user.email}">email</span> · 
              <strong>Username:</strong> <span th:text="${user.username}">user</span> ·
              <strong>Member since:</strong> <span th:text="${#temporals.format(user.createdAt,'MMM yyyy')}">date</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">💾 Save Changes</button>
          <a th:href="@{/candidate/dashboard}" class="btn btn-outline" style="margin-left:.75rem">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
