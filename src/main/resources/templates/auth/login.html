<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <th:block th:replace="~{fragments/layout :: head('Login')}"></th:block>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-icon">🤖</div></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to your ResumeAI account</p>

    <div th:if="${success}" class="alert alert-success" data-auto-dismiss>
      <span class="alert-icon">✓</span><span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
      <span class="alert-icon">✕</span><span th:text="${error}"></span>
    </div>
    <div th:if="${message}" class="alert alert-info">
      <span class="alert-icon">ℹ</span><span th:text="${message}"></span>
    </div>

    <form th:action="@{/auth/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label class="form-label" for="usernameOrEmail">Username or Email <span class="required">*</span></label>
        <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-control"
               placeholder="Enter your username or email" required autofocus/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Enter your password" required/>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem">Sign In</button>
    </form>

    <div class="auth-divider">or</div>
    <p style="text-align:center;font-size:.875rem;color:var(--gray-500)">
      Don't have an account?
      <a th:href="@{/auth/register}" style="font-weight:600">Create one here</a>
    </p>

    <div style="margin-top:1.5rem;padding:1rem;background:var(--gray-50);border-radius:var(--radius);font-size:.8rem;color:var(--gray-500)">
      <strong>Demo Credentials:</strong><br>
      Candidate: <code>candidate1 / Candidate@1234</code><br>
      Recruiter: <code>recruiter1 / Recruiter@1234</code><br>
      Admin: <code>admin / Admin@1234</code>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
