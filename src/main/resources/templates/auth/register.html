<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <th:block th:replace="~{fragments/layout :: head('Register')}"></th:block>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-logo"><div class="auth-logo-icon">🤖</div></div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join ResumeAI to find your perfect job match</p>

    <div th:if="${error}" class="alert alert-danger">
      <span class="alert-icon">✕</span><span th:text="${error}"></span>
    </div>

    <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name <span class="required">*</span></label>
          <input type="text" th:field="*{firstName}" class="form-control"
                 th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" placeholder="First name"/>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" th:field="*{lastName}" class="form-control" placeholder="Last name"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username <span class="required">*</span></label>
        <input type="text" th:field="*{username}" class="form-control"
               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
               placeholder="Choose a username (letters, numbers, _)"/>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" th:field="*{email}" class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="your@email.com"/>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password <span class="required">*</span></label>
          <input type="password" th:field="*{password}" class="form-control"
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                 placeholder="Min 8 chars, upper+lower+digit"/>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password <span class="required">*</span></label>
          <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">I am a <span class="required">*</span></label>
        <div style="display:flex;gap:1rem;margin-top:.5rem">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;padding:.75rem 1.25rem;border:2px solid var(--gray-300);border-radius:var(--radius);flex:1;transition:all .15s"
                 id="roleCandidate">
            <input type="radio" th:field="*{role}" value="CANDIDATE" required style="accent-color:var(--primary)"/>
            <span>🎓 Job Seeker / Candidate</span>
          </label>
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;padding:.75rem 1.25rem;border:2px solid var(--gray-300);border-radius:var(--radius);flex:1;transition:all .15s"
                 id="roleRecruiter">
            <input type="radio" th:field="*{role}" value="RECRUITER" style="accent-color:var(--primary)"/>
            <span>💼 Recruiter / Employer</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem">Create Account</button>
    </form>

    <p style="text-align:center;font-size:.875rem;color:var(--gray-500);margin-top:1.25rem">
      Already have an account? <a th:href="@{/auth/login}" style="font-weight:600">Sign in</a>
    </p>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
