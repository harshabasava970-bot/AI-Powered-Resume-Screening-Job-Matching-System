# =============================================
# Application Configuration
# =============================================
spring.application.name=ai-resume-screening
server.port=${PORT:${SERVER_PORT:8080}}

# =============================================
# Database - credentials read directly by DataSourceConfig.java
# Supports all URL formats:
#   jdbc:mysql://host:port/db?useSSL=true      (standard)
#   jdbc:mysql://host:port/db?ssl-mode=REQUIRED (Aiven JDBC)
#   mysql://user:pass@host:port/db?ssl-mode=REQUIRED (Aiven URI - auto-converted)
# =============================================
# DB_URL, DB_USERNAME, DB_PASSWORD are injected via environment variables
# Do NOT set them here - set them in Render / docker-compose / .env

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =============================================
# Thymeleaf
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# =============================================
# Security
# =============================================
app.security.secret=${APP_SECRET:change-this-secret-in-production-min32chars}

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =============================================
# Logging
# =============================================
logging.level.com.resumescreening=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN

# =============================================
# Matching Engine Weights
# =============================================
app.matching.weight.required-skills=0.60
app.matching.weight.preferred-skills=0.20
app.matching.weight.experience=0.10
app.matching.weight.education=0.10
app.matching.min-recommendation-score=20.0
