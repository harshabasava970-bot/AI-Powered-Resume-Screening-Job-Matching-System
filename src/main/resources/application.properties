# =============================================
# Application Configuration
# =============================================
spring.application.name=ai-resume-screening
server.port=${PORT:${SERVER_PORT:8080}}

# =============================================
# Database Configuration
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_screening_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# Thymeleaf
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# =============================================
# Security
# =============================================
app.security.secret=${APP_SECRET:change-this-secret-in-production-min32chars}

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.app.name=AI Resume Screening System
management.info.app.version=1.0.0

# =============================================
# Logging
# =============================================
logging.level.com.resumescreening=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN

# =============================================
# Matching Engine Weights (configurable)
# =============================================
app.matching.weight.required-skills=0.60
app.matching.weight.preferred-skills=0.20
app.matching.weight.experience=0.10
app.matching.weight.education=0.10
app.matching.min-recommendation-score=20.0
